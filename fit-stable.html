<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>IFB Washing Machine — Will it fit? (AR)</title>
<link rel="icon" type="image/png" href="assets/IFB%20logo%201.png" />

<!-- Three.js r172 (global build used by 8th Wall's XR8.Threejs) -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.172.0/build/three.module.min.js",
    "three/addons/": "https://unpkg.com/three@0.172.0/examples/jsm/"
  }
}
</script>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  window.THREE = { ...THREE };
  window.THREE.GLTFLoader = GLTFLoader;
  window.THREE.RoomEnvironment = RoomEnvironment;
</script>

<!-- 8th Wall helpers (MIT): loading screen, iOS motion permission, unsupported/error UI -->
<script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1.0.0/dist/xrextras.js"></script>
<!-- 8th Wall engine binary (open-source, free commercial use, NO app key). SLAM preloaded. -->
<script async crossorigin="anonymous" data-preload-chunks="slam"
        src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1.0.0/dist/xr.js"></script>

<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;
    -webkit-tap-highlight-color:transparent}
  #camerafeed{position:absolute;inset:0;width:100%;height:100%}

  /* All overlay UI hidden until the camera actually starts (keeps it off the desktop "use your phone" screen) */
  .ui{opacity:0;transition:opacity .25s;pointer-events:none}
  .ui.show{opacity:1;pointer-events:auto}

  .top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 12px;
    background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0))}
  .back{color:#fff;text-decoration:none;font-weight:800;font-size:17px;background:rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.28);border-radius:10px;width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;pointer-events:auto}
  /* The logo PNG already carries the red ground and white wordmark, so the chip that used to
     fake it drops its own background and padding — otherwise it's red on red. */
  .brand{display:block;width:30px;height:30px;border-radius:7px;flex:none}
  .title{color:#fff;font-size:12.5px;opacity:.92;line-height:1.25}

  .dimchip{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translateX(-50%);
    z-index:10;display:none;color:#fff;font-size:12px;font-weight:700;background:rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 13px;white-space:nowrap}

  .dock{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;align-items:center;
    gap:12px;padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 16px);
    background:linear-gradient(0deg,rgba(0,0,0,.5),rgba(0,0,0,0))}
  .status{color:#fff;font-size:14px;font-weight:600;text-align:center;line-height:1.4;
    background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:9px 14px;
    max-width:90vw;backdrop-filter:blur(6px)}
  .row{display:flex;gap:10px}
  .btn{appearance:none;border:0;cursor:pointer;font-weight:800;font-size:15px;color:#fff;border-radius:14px;
    padding:14px 20px;background:linear-gradient(180deg,#ff4d57,#e11d2a);box-shadow:0 8px 22px rgba(225,29,42,.4)}
  .btn[disabled]{opacity:.45;box-shadow:none;filter:grayscale(.3)}
  .btn.sec{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);box-shadow:none;
    font-size:14px;padding:12px 16px}
  .credit{position:fixed;right:8px;bottom:2px;z-index:11;color:rgba(255,255,255,.6);font-size:9.5px}
</style>
</head>
<body>
  <canvas id="camerafeed"></canvas>

  <div class="ui" id="ui">
    <div class="top">
      <a class="back" href="index.html" aria-label="Back">&larr;</a>
      <img class="brand" src="assets/IFB%20logo%201.png" alt="IFB" />
      <span class="title">Will it fit? · washing&nbsp;machine in&nbsp;AR</span>
    </div>
    <div class="dimchip" id="dimchip">Washing machine · 85 × 59 × 62 cm</div>

    <div class="dock">
      <div class="status" id="status">Move your phone slowly to scan the floor…</div>
      <div class="row" id="rowPlace">
        <button class="btn" id="placeBtn" disabled>Place washing machine</button>
      </div>
      <div class="row" id="rowPlaced" style="display:none">
        <button class="btn sec" id="moveBtn">↺ Move</button>
        <button class="btn sec" id="rotBtn">⟳ 45°</button>
        <button class="btn sec" id="dimBtn" aria-label="Toggle dimensions">📐</button>
        <button class="btn sec" id="resetBtn">Reset</button>
      </div>
      <div class="row" id="rowSize" style="display:none;align-items:center;justify-content:center;gap:14px">
        <button class="btn sec" id="sizeMinus" aria-label="Smaller">−</button>
        <span id="sizeLbl" style="min-width:120px;text-align:center;color:#fff;font-weight:700">≈ 80 cm tall</span>
        <button class="btn sec" id="sizePlus" aria-label="Bigger">+</button>
      </div>
    </div>
  </div>
  <div class="credit">Powered by 8th Wall</div>

<script>
/* globals XR8 XRExtras THREE */
(() => {
  const MODEL_URL = 'models/IFB_WM.glb';

  // shared refs
  let scene, camera, renderer, surface, reticle, washer;
  let ready = false;         // model loaded
  let floorPoint = null;     // latest raycast hit on floor (THREE.Vector3) or null
  let placed = false;
  let rotationY = 0;
  // The GLB bakes 0.4245 onto its root node, so at scale 1 the machine is 0.85 m tall
  // (2.0023 × 0.4245). 0.941 therefore shows it at ≈80 cm; − / + fine-tunes from there.
  const DEFAULT_SIZE_SCALE = 0.941;
  let sizeScale = DEFAULT_SIZE_SCALE;
  let raycaster, centerNDC;   // created in buildScene() — THREE isn't ready at parse time

  // Product dimensions in cm at size 100% (edit to the exact IFB spec). The H×W×D labels show
  // these × the current − / + size, so the numbers track the size actually shown.
  const SPEC = { H: 85, W: 59, D: 62 };
  let modelSize = null;       // GLB real size (metres) — used to lay out the dimension lines
  let dimGroup = null;        // the H/W/D lines + labels, parented to the machine
  let dimSets = [];          // [{name, cands:[{line,label,pts,mid}]}] — show the best-facing candidate
  let occluder = null;        // invisible bounding box — hides a dimension that's behind the machine
  let dimsOn = true;          // dimension labels visible?

  // ---- DOM ----
  const ui       = document.getElementById('ui');
  const statusEl = document.getElementById('status');
  const placeBtn = document.getElementById('placeBtn');
  const rowPlace = document.getElementById('rowPlace');
  const rowPlaced= document.getElementById('rowPlaced');
  const moveBtn  = document.getElementById('moveBtn');
  const rotBtn   = document.getElementById('rotBtn');
  const resetBtn = document.getElementById('resetBtn');
  const dimBtn   = document.getElementById('dimBtn');
  const rowSize  = document.getElementById('rowSize');
  const sizeMinus= document.getElementById('sizeMinus');
  const sizePlus = document.getElementById('sizePlus');
  const sizeLbl  = document.getElementById('sizeLbl');
  const dimchip  = document.getElementById('dimchip');

  const setStatus = (t) => { statusEl.textContent = t; };

  const buildScene = () => {
    raycaster = new THREE.Raycaster();
    centerNDC = new THREE.Vector2(0, 0);
    _wp = new THREE.Vector3(); _cam = new THREE.Vector3(); _dir = new THREE.Vector3();
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    try {
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
    } catch (e) {}
    scene.add(new THREE.HemisphereLight(0xffffff, 0x445, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 2.1);
    sun.position.set(2.5, 6, 3);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 40;
    sun.shadow.bias = -0.0005;
    scene.add(sun);

    // invisible shadow-catcher floor for raycasting + grounding
    surface = new THREE.Mesh(
      new THREE.PlaneGeometry(100, 100),
      new THREE.ShadowMaterial({opacity: 0.32})
    );
    surface.rotateX(-Math.PI / 2);
    surface.receiveShadow = true;
    scene.add(surface);

    // placement reticle (flat ring + dot)
    reticle = new THREE.Group();
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.16, 0.20, 40),
      new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.9, side: THREE.DoubleSide})
    );
    const dot = new THREE.Mesh(
      new THREE.CircleGeometry(0.03, 24),
      new THREE.MeshBasicMaterial({color: 0xe11d2a})
    );
    ring.rotateX(-Math.PI / 2); dot.rotateX(-Math.PI / 2);
    reticle.add(ring); reticle.add(dot);
    reticle.visible = false;
    scene.add(reticle);

    camera.position.set(0, 2, 0);

    // preload washer: base-anchored (feet on y=0), centered on x/z, wrapped in a group
    new THREE.GLTFLoader().load(MODEL_URL, (gltf) => {
      const g = new THREE.Group();
      gltf.scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
      const box = new THREE.Box3().setFromObject(gltf.scene);
      const c = box.getCenter(new THREE.Vector3());
      modelSize = box.getSize(new THREE.Vector3());   // real size (metres) for the dim lines
      gltf.scene.position.x -= c.x;
      gltf.scene.position.z -= c.z;
      gltf.scene.position.y -= box.min.y;   // drop base to floor level
      g.add(gltf.scene);
      g.visible = false;
      washer = g;
      scene.add(g);
      // invisible box at the machine's exact bounds — used only to ray-test which dimension
      // lines are hidden behind the machine (cheap proxy instead of the 62k-tri mesh).
      occluder = new THREE.Mesh(
        new THREE.BoxGeometry(modelSize.x, modelSize.y, modelSize.z),
        new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false })
      );
      occluder.position.y = modelSize.y / 2;
      washer.add(occluder);
      ready = true;
    }, undefined, () => setStatus('Could not load the 3D model. Check your connection and reload.'));
  };

  // ---- IKEA-style H×W×D dimension lines + labels wrapped around the placed machine ----
  const makeLabel = (text) => {
    const fs = 44, padX = 24, padY = 14;
    const meas = document.createElement('canvas').getContext('2d');
    meas.font = 'bold ' + fs + 'px Arial';
    const tw = Math.ceil(meas.measureText(text).width);
    const c = document.createElement('canvas');
    c.width = tw + padX * 2; c.height = fs + padY * 2;
    const ctx = c.getContext('2d');
    ctx.font = 'bold ' + fs + 'px Arial';
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(2, 2, c.width - 4, c.height - 4, 20); }
    else { ctx.beginPath(); ctx.rect(2, 2, c.width - 4, c.height - 4); }
    ctx.fillStyle = 'rgba(225,29,42,0.94)'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, c.width / 2, c.height / 2);
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
    spr.renderOrder = 999;
    const hm = 0.085;                       // label ~8.5 cm tall in world space
    spr.scale.set(hm * c.width / c.height, hm, 1);
    return spr;
  };

  const disposeDims = () => {
    if (!dimGroup) return;
    if (washer) washer.remove(dimGroup);
    dimGroup.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
    dimGroup = null;
  };

  // Dimensions shown = spec × current − / + size, so the value tracks the size on screen.
  const curDims = () => ({
    H: Math.round(SPEC.H * sizeScale),
    W: Math.round(SPEC.W * sizeScale),
    D: Math.round(SPEC.D * sizeScale),
  });

  const buildDims = () => {
    if (!washer || !modelSize) return;
    disposeDims();
    dimSets = [];
    dimGroup = new THREE.Group();
    const hw = modelSize.x / 2, H = modelSize.y, hd = modelSize.z / 2, off = 0.05, t = 0.007;
    const cd = curDims();
    const V = (x, y, z) => new THREE.Vector3(x, y, z);
    // One candidate edge = a line + a label + the sample points used to test if it's visible.
    const cand = (geo, linePos, text, labelPos, pts) => {
      const line = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95 }));
      line.position.copy(linePos);
      const label = makeLabel(text); label.position.copy(labelPos);
      dimGroup.add(line); dimGroup.add(label);
      return { line, label, pts, mid: linePos.clone() };
    };

    // HEIGHT — all 4 vertical corners (front-right, front-left, back-right, back-left)
    const hGeo = () => new THREE.BoxGeometry(t, H, t);
    const hSamp = (x, z) => [V(x, 0.05, z), V(x, H / 2, z), V(x, H - 0.05, z)];
    const hLabel = 'H ' + cd.H + ' cm';
    dimSets.push({ name: 'H', cands: [
      cand(hGeo(), V(hw + off, H / 2, hd + off),  hLabel, V(hw + off + 0.03, H / 2, hd + off),  hSamp(hw + off, hd + off)),
      cand(hGeo(), V(-hw - off, H / 2, hd + off), hLabel, V(-hw - off - 0.03, H / 2, hd + off), hSamp(-hw - off, hd + off)),
      cand(hGeo(), V(hw + off, H / 2, -hd - off), hLabel, V(hw + off + 0.03, H / 2, -hd - off), hSamp(hw + off, -hd - off)),
      cand(hGeo(), V(-hw - off, H / 2, -hd - off),hLabel, V(-hw - off - 0.03, H / 2, -hd - off),hSamp(-hw - off, -hd - off)),
    ]});

    // WIDTH — front and back bottom edges (span x)
    const wGeo = () => new THREE.BoxGeometry(modelSize.x, t, t);
    const wSamp = (z) => [V(-hw + 0.05, 0.05, z), V(0, 0.05, z), V(hw - 0.05, 0.05, z)];
    const wLabel = 'W ' + cd.W + ' cm';
    dimSets.push({ name: 'W', cands: [
      cand(wGeo(), V(0, 0.002, hd + off),  wLabel, V(0, 0.06, hd + off + 0.03),  wSamp(hd + off)),
      cand(wGeo(), V(0, 0.002, -hd - off), wLabel, V(0, 0.06, -hd - off - 0.03), wSamp(-hd - off)),
    ]});

    // DEPTH — right and left bottom edges (span z)
    const dGeo = () => new THREE.BoxGeometry(t, t, modelSize.z);
    const dSamp = (x) => [V(x, 0.05, -hd + 0.05), V(x, 0.05, 0), V(x, 0.05, hd - 0.05)];
    const dLabel = 'D ' + cd.D + ' cm';
    dimSets.push({ name: 'D', cands: [
      cand(dGeo(), V(hw + off, 0.002, 0),  dLabel, V(hw + off + 0.03, 0.06, 0),  dSamp(hw + off)),
      cand(dGeo(), V(-hw - off, 0.002, 0), dLabel, V(-hw - off - 0.03, 0.06, 0), dSamp(-hw - off)),
    ]});

    dimGroup.visible = dimsOn;
    washer.add(dimGroup);
  };

  // Hide any dimension whose line is COMPLETELY behind the machine from the current view.
  let _wp, _cam, _dir;   // THREE vectors — created in buildScene() (THREE isn't ready at parse time)
  const clearPt = (localPt) => {                 // is this sample point un-occluded by the machine?
    _wp.copy(localPt); washer.localToWorld(_wp);
    _dir.copy(_wp).sub(_cam);
    const dist = _dir.length();
    raycaster.set(_cam, _dir.normalize());
    const hit = raycaster.intersectObject(occluder, false);
    return !(hit.length && hit[0].distance < dist - 0.02);
  };
  const updateDimOcclusion = () => {
    if (!dimSets.length || !occluder || !camera || !washer) return;
    washer.updateWorldMatrix(true, true);        // refresh washer + occluder + dim matrices
    camera.getWorldPosition(_cam);
    for (const set of dimSets) {
      // pick the candidate edge with the most visible sample points; tie-break by nearest to camera
      let best = null, bestVis = -1, bestDist = Infinity;
      for (const c of set.cands) {
        c.line.visible = false; c.label.visible = false;      // hide all, re-show the winner
        let vis = 0;
        for (const p of c.pts) if (clearPt(p)) vis++;
        _wp.copy(c.mid); washer.localToWorld(_wp);
        const md = _wp.distanceTo(_cam);
        if (vis > bestVis || (vis === bestVis && md < bestDist)) { best = c; bestVis = vis; bestDist = md; }
      }
      if (best && bestVis > 0) { best.line.visible = true; best.label.visible = true; }  // one label, best-facing side
    }
  };

  const applySize = () => {
    if (washer) washer.scale.setScalar(sizeScale);
    const d = curDims();
    if (sizeLbl) sizeLbl.textContent = '≈ ' + d.H + ' cm tall';
    if (dimchip) dimchip.textContent = 'IFB washing machine · ' + d.H + ' × ' + d.W + ' × ' + d.D + ' cm';
  };

  const doPlace = () => {
    if (!ready || !floorPoint) return;
    washer.position.set(floorPoint.x, 0, floorPoint.z);
    washer.rotation.y = rotationY;
    washer.scale.setScalar(sizeScale);
    washer.visible = true;
    placed = true;
    reticle.visible = false;
    rowPlace.style.display = 'none';
    rowPlaced.style.display = 'flex';
    rowSize.style.display = 'flex';
    dimchip.style.display = 'block';
    applySize();
    buildDims();          // draw the H×W×D lines + labels around it (IKEA-style)
    setStatus('Placed. H×W×D shown · − / + adjusts view size · drag to rotate · 📐 toggles labels.');
  };

  const enterMove = () => {
    placed = false;
    rowPlaced.style.display = 'none';
    rowSize.style.display = 'none';
    rowPlace.style.display = 'flex';
    dimchip.style.display = 'none';
    setStatus('Aim at a new spot on the floor, then tap “Place”.');
  };

  // Reset: clear the placement entirely and go back to aiming. Setting `placed = false` is
  // what brings the reticle back — onUpdate resumes raycasting the floor on the next frame
  // and shows it again. Unlike Move, this also restores the default size and rotation, so
  // the user starts from a known ≈80 cm machine rather than whatever they had tuned to.
  const doReset = () => {
    if (washer) {
      washer.visible = false;
      washer.rotation.y = 0;
    }
    placed = false;
    rotationY = 0;
    sizeScale = DEFAULT_SIZE_SCALE;
    applySize();

    rowPlaced.style.display = 'none';
    rowSize.style.display = 'none';
    rowPlace.style.display = 'flex';
    dimchip.style.display = 'none';
    setStatus('Reset. Aim at the floor, then tap “Place”.');
  };

  // one-finger drag on the camera (only when placed) => rotate the machine
  let dragX = null, dragBase = 0;
  const onCanvasStart = (e) => {
    if (!placed || e.touches.length !== 1) return;
    dragX = e.touches[0].clientX; dragBase = rotationY;
  };
  const onCanvasMove = (e) => {
    if (dragX === null || !placed || e.touches.length !== 1) return;
    e.preventDefault();
    const dx = e.touches[0].clientX - dragX;
    rotationY = dragBase + (dx / window.innerWidth) * Math.PI * 2;
    if (washer) washer.rotation.y = rotationY;
  };
  const onCanvasEnd = () => { dragX = null; };

  const pipeline = () => ({
    name: 'ifb-fit',
    onStart: ({canvas}) => {
      const s = XR8.Threejs.xrScene();
      scene = s.scene; camera = s.camera; renderer = s.renderer;
      buildScene();
      XR8.XrController.updateCameraProjectionMatrix({origin: camera.position, facing: camera.quaternion});

      canvas.addEventListener('touchstart', onCanvasStart, {passive: true});
      canvas.addEventListener('touchmove', onCanvasMove, {passive: false});
      canvas.addEventListener('touchend', onCanvasEnd, {passive: true});

      ui.classList.add('show');            // reveal controls now that camera is live
      setStatus('Move your phone slowly to scan the floor…');
    },
    // runs each frame after the camera pose is updated — keep the reticle on the floor under screen-centre
    onUpdate: () => {
      if (placed) { updateDimOcclusion(); return; }   // hide dims that are behind the machine
      if (!surface) return;
      raycaster.setFromCamera(centerNDC, camera);
      const hit = raycaster.intersectObject(surface)[0];
      if (hit) {
        floorPoint = hit.point;
        reticle.position.set(hit.point.x, 0.002, hit.point.z);
        reticle.visible = true;
        if (ready && placeBtn.disabled) { placeBtn.disabled = false; setStatus('Floor found — aim, then tap “Place”.'); }
      } else {
        floorPoint = null;
        reticle.visible = false;
      }
    },
  });

  // ---- buttons ----
  placeBtn.addEventListener('click', doPlace);
  moveBtn.addEventListener('click', enterMove);
  rotBtn.addEventListener('click', () => { rotationY += Math.PI / 4; if (washer) washer.rotation.y = rotationY; });
  // Previously this only called XR8.XrController.recenter(), which shifts the world origin
  // but leaves the machine placed and the reticle hidden — so Reset appeared to do nothing.
  resetBtn.addEventListener('click', doReset);
  const stepSize = (d) => {
    sizeScale = Math.min(1.4, Math.max(0.35, +(sizeScale + d).toFixed(3)));
    applySize();
    if (placed && washer && washer.visible) buildDims();   // refresh H×W×D labels to the new size
  };
  sizeMinus.addEventListener('click', () => stepSize(-0.02));
  sizePlus.addEventListener('click', () => stepSize(+0.02));
  dimBtn.addEventListener('click', () => {
    dimsOn = !dimsOn;
    if (dimGroup) dimGroup.visible = dimsOn;
    dimBtn.style.opacity = dimsOn ? '1' : '0.5';
  });

  // ---- boot ----
  const onxrloaded = () => {
    XR8.addCameraPipelineModules([
      XR8.GlTextureRenderer.pipelineModule(),
      XR8.Threejs.pipelineModule(),
      XR8.XrController.pipelineModule(),
      XRExtras.AlmostThere.pipelineModule(),
      XRExtras.FullWindowCanvas.pipelineModule(),
      XRExtras.Loading.pipelineModule(),
      XRExtras.RuntimeError.pipelineModule(),
      pipeline(),
    ]);
    // Real-world scale: 1 three.js unit = 1 metre, so the 0.85 m model shows at TRUE size.
    // (8th Wall defaults to "responsive", which sizes by camera distance and looks too small.)
    XR8.XrController.configure({ scale: 'absolute' });
    XR8.run({canvas: document.getElementById('camerafeed')});
  };
  const boot = () => XRExtras.Loading.showLoading({onxrloaded});
  window.onload = () => { window.XRExtras ? boot() : window.addEventListener('xrextrasloaded', boot); };
})();
</script>
</body>
</html>
